name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v6
      with:
          role-to-assume: arn:aws:iam::970869661367:role/clinic-booking-oidc
          aws-region: us-east-1

    - name: Verify identity
      run: aws sts get-caller-identity

    # Upload the web page to S3 (Amplify serves it over https). no-cache = browsers always get the latest version.
    - name: Sync to S3
      run: aws s3 sync ./frontend/ s3://clinic-booking-frontend/ --delete --cache-control "no-cache"
