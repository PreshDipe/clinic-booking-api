<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Booking</title>
<style>
  :root {
    --bg:#f5f7f8; --surface:#ffffff; --surface-2:#f0f3f4; --ink:#16202a; --muted:#5d6b78; --line:#e1e6ea;
    --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:#e3f3f1;
    --ok:#067647; --ok-bg:#e8f7ee; --bad:#b42318; --bad-bg:#fdeceb; --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e1116; --surface:#161b22; --surface-2:#1c222b; --ink:#e7ebef; --muted:#9aa6b2; --line:#29313b;
      --brand:#2dd4bf; --brand-ink:#05201d; --brand-soft:#123430;
      --ok:#6ce9a6; --ok-bg:#0f2a1d; --bad:#fda29b; --bad-bg:#2e1513; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  [hidden] { display:none !important; }
  button { font:inherit; cursor:pointer; }
  input { font:inherit; }

  .topbar { background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar-inner { max-width:1040px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .logo { width:34px; height:34px; border-radius:9px; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center; font-weight:800; font-size:22px; }
  .brand h1 { font-size:18px; margin:0; line-height:1.2; }
  .brand p { margin:0; font-size:13px; color:var(--muted); }
  .topbar .spacer { flex:1; }
  .conn { display:flex; align-items:center; gap:4px 8px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .conn > * { white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); }
  .link { background:none; border:0; color:var(--brand); padding:4px 6px; border-radius:6px; font-size:13px; }
  .link:hover { background:var(--brand-soft); }

  main { max-width:1040px; margin:0 auto; padding:20px 16px 48px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }

  .connect { max-width:440px; margin:48px auto; padding:28px; }
  .connect h2 { margin:0 0 6px; font-size:20px; }
  .connect p { margin:0 0 18px; color:var(--muted); }

  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .field { margin-bottom:14px; }
  .input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--ink); }
  .input:focus { outline:2px solid var(--brand); outline-offset:1px; border-color:transparent; }
  .input[aria-invalid="true"] { border-color:var(--bad); }
  .err { color:var(--bad); font-size:13px; margin-top:4px; min-height:0; }
  .btn { padding:10px 16px; border:0; border-radius:10px; background:var(--brand); color:var(--brand-ink); font-weight:600; }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn.secondary { background:var(--surface-2); color:var(--ink); border:1px solid var(--line); }
  .btn.danger { background:transparent; color:var(--bad); border:1px solid var(--line); }
  .btn.block { width:100%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .row > .grow { flex:1 1 220px; }

  .msg { padding:10px 12px; border-radius:10px; margin-top:12px; font-size:14px; }
  .msg.ok { background:var(--ok-bg); color:var(--ok); }
  .msg.bad { background:var(--bad-bg); color:var(--bad); }

  .tabs { display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); padding:4px; border-radius:12px; width:max-content; max-width:100%; margin-bottom:18px; }
  .tab { border:0; background:transparent; color:var(--muted); padding:8px 16px; border-radius:9px; font-weight:600; }
  .tab[aria-selected="true"] { background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

  .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .section-head h2 { margin:0; font-size:18px; }
  .hint { color:var(--muted); font-size:14px; margin:0; }

  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .chip { border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:6px 14px; border-radius:99px; font-size:14px; }
  .chip[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }

  /* calendar + day panel */
  .booker { display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start; }
  @media (max-width: 780px) { .booker { grid-template-columns:1fr; } }
  .cal { padding:16px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-head h3 { margin:0; font-size:16px; }
  .nav { width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:16px; line-height:1; }
  .nav:disabled { opacity:.35; cursor:not-allowed; }
  .cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
  .dow { text-align:center; font-size:12px; font-weight:600; color:var(--muted); padding:4px 0; }
  .day-cell { aspect-ratio:1 / 1; min-height:38px; border:1px solid transparent; border-radius:10px; background:transparent; color:var(--ink);
              display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:0; font-weight:600; position:relative; }
  .day-cell .n { font-size:14px; }
  .day-cell .open { font-size:10px; font-weight:600; color:var(--brand); line-height:1; }
  .day-cell.has-open { background:var(--brand-soft); }
  .day-cell.has-open:hover:not(:disabled) { border-color:var(--brand); }
  .day-cell:disabled { color:var(--muted); opacity:.45; cursor:default; background:transparent; }
  .day-cell.today .n { text-decoration:underline; text-underline-offset:3px; }
  .day-cell[aria-pressed="true"] { background:var(--brand); color:var(--brand-ink); }
  .day-cell[aria-pressed="true"] .open { color:var(--brand-ink); }
  .legend { display:flex; gap:14px; margin-top:12px; font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .day-panel { padding:18px; min-height:300px; }
  .day-panel h3 { margin:0; font-size:18px; }
  .day-panel .sub { margin:2px 0 14px; color:var(--muted); font-size:14px; }

  .slots { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .slot { text-align:left; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px 14px; transition:border-color .12s, transform .12s, box-shadow .12s; }
  .slot:hover:not(:disabled) { border-color:var(--brand); box-shadow:var(--shadow); transform:translateY(-1px); }
  .slot:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .slot .time { font-size:18px; font-weight:700; display:block; }
  .slot .doc { color:var(--muted); font-size:14px; display:block; }
  .slot .cta { display:inline-block; margin-top:8px; font-size:13px; font-weight:600; color:var(--brand); }
  .slot:disabled { cursor:not-allowed; background:var(--surface-2); }
  .slot:disabled .time { color:var(--muted); text-decoration:line-through; }
  .slot:disabled .cta { color:var(--muted); }
  .empty { text-align:center; padding:40px 16px; color:var(--muted); }

  .badge { display:inline-block; font-size:12px; font-weight:600; padding:2px 10px; border-radius:99px; }
  .badge.confirmed { background:var(--ok-bg); color:var(--ok); }
  .badge.cancelled { background:var(--bad-bg); color:var(--bad); }

  dialog { border:0; border-radius:16px; padding:0; width:min(460px, calc(100vw - 32px)); background:var(--surface); color:var(--ink); box-shadow:0 24px 64px rgba(0,0,0,.35); }
  dialog::backdrop { background:rgba(8,12,16,.55); }
  .dlg-head { display:flex; align-items:flex-start; gap:12px; padding:20px 20px 0; }
  .dlg-head h2 { margin:0; font-size:18px; }
  .dlg-head p { margin:2px 0 0; color:var(--muted); font-size:14px; }
  .dlg-head .x { margin-left:auto; background:none; border:0; color:var(--muted); font-size:22px; line-height:1; padding:2px 6px; border-radius:8px; }
  .dlg-head .x:hover { background:var(--surface-2); }
  .dlg-body { padding:16px 20px 20px; }
  .success-icon { width:44px; height:44px; border-radius:50%; background:var(--ok-bg); color:var(--ok); display:grid; place-items:center; font-size:22px; font-weight:700; }
  .success-icon.cancelled { background:var(--bad-bg); color:var(--bad); }
  dl.details { display:grid; grid-template-columns:110px 1fr; gap:8px 12px; margin:16px 0; font-size:14px; }
  dl.details dt { color:var(--muted); }
  dl.details dd { margin:0; word-break:break-word; }
  .ref { display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px dashed var(--line); border-radius:10px; padding:8px 10px; font-family:ui-monospace,Consolas,monospace; font-size:13px; word-break:break-all; }
  .ref span { flex:1; }
  .actions { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .actions .btn { flex:1; }

  .bookings { display:grid; gap:10px; margin-top:16px; }
  .booking { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:14px 16px; }
  .booking .main { flex:1 1 220px; }
  .booking .when { font-weight:600; }
  .booking .sub { color:var(--muted); font-size:13px; word-break:break-all; }
  .panel { padding:20px; }
  .divider { height:1px; background:var(--line); margin:22px 0; }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; font-size:14px; box-shadow:var(--shadow); z-index:10; max-width:calc(100vw - 32px); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo" aria-hidden="true">+</div>
    <div class="brand">
      <h1>Clinic Booking</h1>
      <p>Book an appointment in under a minute</p>
    </div>
    <div class="spacer"></div>
    <div class="conn" id="connBar" hidden>
      <span class="dot" aria-hidden="true"></span><span>Connected</span>
      <button class="link" id="resetBtn" title="Replace all slots with sample ones for the next 5 weeks and delete all bookings">Load sample appointments</button>
      <button class="link" id="changeKeyBtn">Change API key</button>
    </div>
  </div>
</header>

<main>
  <!-- Shown until a valid API key is entered -->
  <section id="connectView" class="card connect" aria-labelledby="connectTitle">
    <h2 id="connectTitle">Welcome</h2>
    <p>Enter the clinic's API key to see available appointments.</p>
    <form id="connectForm" novalidate>
      <div class="field">
        <label for="apiKey">API key</label>
        <input id="apiKey" class="input" type="password" autocomplete="off" placeholder="Paste your X-API-Key">
      </div>
      <button id="connectBtn" class="btn block" type="submit">Continue</button>
      <div id="connectMsg" class="msg" role="alert" hidden></div>
    </form>
  </section>

  <!-- The app -->
  <section id="appView" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" id="tabBook" role="tab" aria-selected="true" aria-controls="panelBook">Book an appointment</button>
      <button class="tab" id="tabMine" role="tab" aria-selected="false" aria-controls="panelMine">My bookings</button>
    </div>

    <div id="panelBook" role="tabpanel" aria-labelledby="tabBook">
      <div class="section-head">
        <h2>Choose a day and time</h2>
        <p class="hint">Highlighted days have open appointments.</p>
      </div>
      <div class="chips" id="providerChips" aria-label="Filter by doctor"></div>
      <div class="booker">
        <div class="card cal" id="calendar">
          <div class="cal-head">
            <button class="nav" id="prevMonth" type="button" aria-label="Previous month">‹</button>
            <h3 id="monthTitle"></h3>
            <button class="nav" id="nextMonth" type="button" aria-label="Next month">›</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="legend"><span><i style="background:var(--brand-soft)"></i>Open times</span><span><i style="background:var(--brand)"></i>Selected</span></div>
        </div>
        <div class="card day-panel">
          <h3 id="dayTitle">Pick a day</h3>
          <p class="sub" id="daySub"></p>
          <div id="slots" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div id="panelMine" role="tabpanel" aria-labelledby="tabMine" hidden>
      <div class="card panel">
        <div class="section-head"><h2>Find your bookings</h2></div>
        <form id="mineForm" class="row" novalidate>
          <div class="grow">
            <label for="mineEmail">Email you booked with</label>
            <input id="mineEmail" class="input" type="email" placeholder="ada@example.com">
          </div>
          <button id="mineBtn" class="btn" type="submit">Show bookings</button>
        </form>
        <div id="mineMsg" class="msg" role="alert" hidden></div>
        <div id="mineList" class="bookings"></div>
        <div class="actions" style="justify-content:center"><button id="moreBtn" class="btn secondary" hidden>Load more</button></div>

        <div class="divider"></div>

        <form id="lookupForm" class="row" novalidate>
          <div class="grow">
            <label for="lookupId">Or look up a booking reference</label>
            <input id="lookupId" class="input" placeholder="e.g. 3f2a9c1e-…">
          </div>
          <button id="lookupBtn" class="btn secondary" type="submit">Look up</button>
        </form>
        <div id="lookupMsg" class="msg" role="alert" hidden></div>
        <div id="lookupResult" class="bookings"></div>
      </div>
    </div>
  </section>
</main>

<!-- Booking dialog: opens when a slot is clicked -->
<dialog id="bookDialog" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <div>
      <h2 id="dlgTitle">Book appointment</h2>
      <p id="dlgWhen"></p>
    </div>
    <button class="x" id="closeDialog" aria-label="Close">×</button>
  </div>

  <div class="dlg-body" id="formView">
    <form id="bookForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" class="input" autocomplete="name" placeholder="Ada Obi" aria-describedby="nameErr">
        <div id="nameErr" class="err" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" class="input" type="email" autocomplete="email" placeholder="ada@example.com" aria-describedby="emailErr">
        <div id="emailErr" class="err" aria-live="polite"></div>
      </div>
      <button id="bookBtn" class="btn block" type="submit">Confirm booking</button>
      <div id="bookMsg" class="msg" role="alert" hidden></div>
    </form>
  </div>

  <div class="dlg-body" id="successView" hidden>
    <div class="success-icon" id="successIcon" aria-hidden="true">✓</div>
    <h2 id="successTitle" style="margin:12px 0 0;font-size:18px">You're booked</h2>
    <dl class="details" id="confirmDetails"></dl>
    <label>Booking reference</label>
    <div class="ref"><span id="bookingRef"></span><button class="link" id="copyRef" type="button">Copy</button></div>
    <div id="cancelMsg" class="msg" role="status" hidden></div>
    <div class="actions">
      <button class="btn danger" id="cancelBtn" type="button">Cancel booking</button>
      <button class="btn" id="doneBtn" type="button">Done</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// API Gateway URL from config.js (empty = same site as this page).
const API_BASE = String(window.CLINIC_API_BASE || '').replace(/\/+$/, '');
const API_CONFIGURED = !API_BASE.includes('YOUR-API-ID');
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

// The key is kept only for this browser tab (sessionStorage), never in the page or the repo.
const keyStore = {
  get() { try { return sessionStorage.getItem('apiKey') || ''; } catch { return ''; } },
  set(v) { try { sessionStorage.setItem('apiKey', v); } catch {} },
  clear() { try { sessionStorage.removeItem('apiKey'); } catch {} },
};

let apiKey = '';
let allSlots = [];          // unfiltered list, used for doctor chips and booking details
let slotsById = {};
let provider = '';          // '' = all doctors
let current = { slot: null, booking: null, idem: null };
let mineCursor = null, mineEmail = '';

// ---------- helpers ----------
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) el.append(c);
  return el;
}
function showMsg(el, kind, text) { el.textContent = text || ''; el.className = 'msg' + (text ? ' ' + kind : ''); el.hidden = !text; }
let toastTimer;
function toast(text) { const t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3000); }

const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtDay = (iso) => new Date(iso).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
const fmtWhen = (s) => `${fmtDay(s.start)} · ${fmtTime(s.start)} – ${fmtTime(s.end)}`;
const minutes = (s) => Math.round((new Date(s.end) - new Date(s.start)) / 60000);

async function api(method, path, body, extraHeaders = {}) {
  try {
    const res = await fetch(API_BASE + path, {
      method,
      headers: { 'X-API-Key': apiKey, ...(body ? { 'Content-Type': 'application/json' } : {}), ...extraHeaders },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== '/slots?probe') handleUnauthorized();
    return { status: res.status, data, retryAfter: res.headers.get('Retry-After') };
  } catch {
    return { status: 0, data: { error: 'Could not reach the server. Check your connection.' } };
  }
}

// ---------- connect ----------
function showApp(on) {
  $('connectView').hidden = on; $('appView').hidden = !on; $('connBar').hidden = !on;
}
function handleUnauthorized() {
  keyStore.clear(); apiKey = '';
  if ($('bookDialog').open) $('bookDialog').close();
  showApp(false);
  showMsg($('connectMsg'), 'bad', 'Your API key was rejected (401). Please enter it again.');
}
async function connect(key, quiet) {
  apiKey = key.trim();
  if (!API_CONFIGURED) return showMsg($('connectMsg'), 'bad', 'This page is not connected to the API yet: set your API Gateway URL in config.js.');
  if (!apiKey) return showMsg($('connectMsg'), 'bad', 'Please enter the API key.');
  $('connectBtn').disabled = true;
  const r = await api('GET', '/slots?probe');
  $('connectBtn').disabled = false;
  if (r.status === 401) { apiKey = ''; if (!quiet) showMsg($('connectMsg'), 'bad', '401: that API key was not accepted.'); return; }
  if (r.status !== 200) { apiKey = ''; showMsg($('connectMsg'), 'bad', r.data.error || `Something went wrong (${r.status}).`); return; }
  keyStore.set(apiKey);
  showMsg($('connectMsg'));
  showApp(true);
  setAllSlots(r.data.slots);
  renderSlots(r.data.slots);
}
$('connectForm').addEventListener('submit', (e) => { e.preventDefault(); connect($('apiKey').value); });
$('changeKeyBtn').onclick = () => { keyStore.clear(); apiKey = ''; $('apiKey').value = ''; showApp(false); $('apiKey').focus(); };

// ---------- slots ----------
function setAllSlots(slots) {
  allSlots = slots;
  slotsById = Object.fromEntries(slots.map((s) => [s.id, s]));
  renderChips();
}
function renderChips() {
  const providers = [...new Set(allSlots.map((s) => s.provider))].sort();
  if (provider && !providers.includes(provider)) provider = '';
  const chip = (label, value) => h('button', {
    class: 'chip', type: 'button', 'data-provider': value, 'aria-pressed': String(provider === value),
    text: label, onclick: () => { provider = value; renderChips(); loadSlots(); },
  });
  $('providerChips').replaceChildren(chip('All doctors', ''), ...providers.map((p) => chip(p, p)));
}
async function loadSlots() {
  const all = await api('GET', '/slots');
  if (all.status !== 200) return;
  setAllSlots(all.data.slots);
  if (!provider) return renderSlots(all.data.slots);
  const r = await api('GET', '/slots?provider=' + encodeURIComponent(provider)); // server-side filter
  if (r.status === 200) renderSlots(r.data.slots);
}
// ---------- calendar ----------
const pad = (n) => String(n).padStart(2, '0');
// Local calendar date of a timestamp, e.g. "2026-11-16" (exposed for tests).
function dateKey(iso) { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
window.dateKey = dateKey;
const todayKey = () => dateKey(new Date());
const isPast = (s) => new Date(s.start) <= new Date();
const bookable = (s) => s.available && !isPast(s);

let shownSlots = [];        // slots for the current doctor filter
let byDay = new Map();      // dateKey -> slots
let selectedDay = null;     // dateKey
let viewMonth = null;       // Date at the 1st of the month shown

function renderSlots(slots) {
  shownSlots = slots;
  byDay = new Map();
  for (const s of slots) {
    const k = dateKey(s.start);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(s);
  }
  const openDays = [...byDay.keys()].filter((k) => byDay.get(k).some(bookable)).sort();
  // Keep the chosen day if it still has slots; otherwise jump to the next day with open times.
  if (!selectedDay || !byDay.has(selectedDay) || selectedDay < todayKey()) selectedDay = openDays[0] || null;
  if (selectedDay && (!viewMonth || !monthHasDay(viewMonth, selectedDay))) {
    const [y, m] = selectedDay.split('-').map(Number);
    viewMonth = new Date(y, m - 1, 1); // show the month that contains the selected day
  } else if (!viewMonth) {
    const now = new Date(); viewMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  renderCalendar();
  renderDay();
}
function monthHasDay(month, key) { return key.startsWith(`${month.getFullYear()}-${pad(month.getMonth() + 1)}`); }

function renderCalendar() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  $('monthTitle').textContent = viewMonth.toLocaleDateString([], { month: 'long', year: 'numeric' });
  const now = new Date();
  $('prevMonth').disabled = y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth());
  const cells = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => h('div', { class: 'dow', text: d }));
  const lead = (new Date(y, m, 1).getDay() + 6) % 7; // Monday-first
  for (let i = 0; i < lead; i++) cells.push(h('div'));
  const days = new Date(y, m + 1, 0).getDate();
  const today = todayKey();
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(m + 1)}-${pad(d)}`;
    const list = byDay.get(key) || [];
    const open = list.filter(bookable).length;
    const past = key < today;
    const label = new Date(y, m, d).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
    cells.push(h('button', {
      class: 'day-cell' + (open ? ' has-open' : '') + (key === today ? ' today' : ''),
      type: 'button', 'data-date': key, 'data-open': String(open),
      disabled: past || !list.length, 'aria-pressed': String(key === selectedDay),
      'aria-label': `${label}, ${open ? open + ' open' : 'no open times'}`,
      onclick: () => { selectedDay = key; renderCalendar(); renderDay(); },
    }, h('span', { class: 'n', text: String(d) }), open ? h('span', { class: 'open', text: `${open} open` }) : null));
  }
  $('calGrid').replaceChildren(...cells);
}
$('prevMonth').onclick = () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1); renderCalendar(); };
$('nextMonth').onclick = () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1); renderCalendar(); };

function renderDay() {
  const box = $('slots');
  const anyUpcoming = shownSlots.some(bookable);
  if (!selectedDay || !anyUpcoming) {
    $('dayTitle').textContent = 'No open appointments';
    $('daySub').textContent = provider ? `${provider} has no upcoming open times.` : 'There are no upcoming open times.';
    box.replaceChildren(h('div', { class: 'empty' },
      h('p', { text: 'Load sample appointments to try the booking flow.' }),
      h('button', { class: 'btn', type: 'button', text: 'Load sample appointments (next 5 weeks)', onclick: resetDemo })));
    return;
  }
  const list = (byDay.get(selectedDay) || []).slice().sort((a, b) => new Date(a.start) - new Date(b.start));
  const open = list.filter(bookable).length;
  $('dayTitle').textContent = new Date(list[0].start).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  $('daySub').textContent = open ? `${open} open time${open === 1 ? '' : 's'}. Click one to book.` : 'Fully booked. Pick another highlighted day.';
  box.replaceChildren(h('div', { class: 'slots' }, list.map((s) => {
    const state = isPast(s) ? 'Past' : s.available ? 'Book →' : 'Booked';
    return h('button', {
      class: 'slot', type: 'button', 'data-id': s.id, disabled: !bookable(s),
      'aria-label': `${s.provider}, ${fmtWhen(s)}, ${state === 'Book →' ? 'open' : state.toLowerCase()}`,
      onclick: () => openBooking(s),
    },
      h('span', { class: 'time', text: fmtTime(s.start) }),
      h('span', { class: 'doc', text: `${s.provider} · ${minutes(s)} min` }),
      h('span', { class: 'cta', text: state }));
  })));
}

// ---------- booking dialog ----------
function openBooking(slot) {
  current = { slot, booking: null, idem: null };
  $('dlgTitle').textContent = `Book with ${slot.provider}`;
  $('dlgWhen').textContent = fmtWhen(slot);
  $('formView').hidden = false; $('successView').hidden = true;
  showMsg($('bookMsg')); setFieldError('name', ''); setFieldError('email', '');
  $('bookBtn').disabled = false; $('bookBtn').textContent = 'Confirm booking';
  $('bookDialog').showModal();
  $('name').focus();
}
function setFieldError(id, text) {
  $(id + 'Err').textContent = text;
  $(id).setAttribute('aria-invalid', text ? 'true' : 'false');
}
function validate() {
  const name = $('name').value.trim();
  const email = $('email').value.trim();
  setFieldError('name', name ? '' : 'Please enter your name.');
  setFieldError('email', !email ? 'Please enter your email.' : EMAIL_RE.test(email) ? '' : 'Please enter a valid email, like ada@example.com.');
  if (!name) $('name').focus(); else if (!EMAIL_RE.test(email)) $('email').focus();
  return name && EMAIL_RE.test(email);
}
$('name').addEventListener('input', () => setFieldError('name', ''));
$('email').addEventListener('input', () => setFieldError('email', ''));

$('bookForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  showMsg($('bookMsg'));
  if (!validate()) return;
  const body = { slot_id: current.slot.id, name: $('name').value, email: $('email').value };
  // One Idempotency-Key per attempt: a double click or a network retry can never double-book.
  const sig = JSON.stringify(body);
  if (!current.idem || current.idem.sig !== sig) current.idem = { key: crypto.randomUUID(), sig };
  $('bookBtn').disabled = true; $('bookBtn').textContent = 'Booking…';
  const r = await api('POST', '/bookings', body, { 'Idempotency-Key': current.idem.key });
  $('bookBtn').disabled = false; $('bookBtn').textContent = 'Confirm booking';

  if (r.status === 201) { showSuccess(r.data); loadSlots(); return; }
  if (r.status === 409) { showMsg($('bookMsg'), 'bad', 'Sorry, someone has just booked this time. Please choose another slot.'); $('bookBtn').disabled = true; loadSlots(); return; }
  if (r.status === 429) { showMsg($('bookMsg'), 'bad', `Too many attempts for this email. Please try again in ${r.retryAfter} seconds.`); return; }
  if (r.status === 404) { showMsg($('bookMsg'), 'bad', 'This slot no longer exists. Please choose another.'); loadSlots(); return; }
  if (r.status === 400 && /started/.test(r.data.error || '')) { showMsg($('bookMsg'), 'bad', 'This appointment has already started. Please choose a later time.'); return; }
  showMsg($('bookMsg'), 'bad', r.data.error ? `${r.status}: ${r.data.error}` : 'Something went wrong. Please try again.');
});

function showSuccess(b) {
  current.booking = b;
  const s = slotsById[b.slot_id] || current.slot;
  $('formView').hidden = true; $('successView').hidden = false;
  renderConfirmation(b, s);
}
function renderConfirmation(b, s) {
  const cancelled = b.status === 'cancelled';
  $('successIcon').textContent = cancelled ? '×' : '✓';
  $('successIcon').classList.toggle('cancelled', cancelled);
  $('successTitle').textContent = cancelled ? 'Booking cancelled' : "You're booked";
  const rows = [
    ['Doctor', s ? s.provider : '—'],
    ['When', s ? fmtWhen(s) : b.slot_id],
    ['Name', b.name],
    ['Email', b.email],
  ];
  $('confirmDetails').replaceChildren(...rows.flatMap(([k, v]) => [h('dt', { text: k }), h('dd', { text: v })]),
    h('dt', { text: 'Status' }), h('dd', {}, h('span', { class: 'badge ' + b.status, text: b.status })));
  $('bookingRef').textContent = b.id;
  $('cancelBtn').disabled = cancelled;
  $('cancelBtn').hidden = cancelled;
}
$('copyRef').onclick = async () => {
  try { await navigator.clipboard.writeText($('bookingRef').textContent); toast('Booking reference copied'); } catch { toast('Copy failed, select the reference instead'); }
};
$('cancelBtn').onclick = async () => {
  const b = current.booking;
  if (!b) return;
  $('cancelBtn').disabled = true;
  const r = await api('DELETE', '/bookings/' + encodeURIComponent(b.id));
  if (r.status === 200 || r.status === 409) {
    const updated = r.status === 200 ? r.data : { ...b, status: 'cancelled' };
    current.booking = updated;
    renderConfirmation(updated, slotsById[b.slot_id] || current.slot);
    showMsg($('cancelMsg'), 'ok', 'Your booking has been cancelled and the slot is free again.');
    loadSlots();
  } else {
    $('cancelBtn').disabled = false;
    showMsg($('cancelMsg'), 'bad', r.data.error || 'Could not cancel. Please try again.');
  }
};
function closeDialog() { $('bookDialog').close(); }
$('doneBtn').onclick = closeDialog;
$('closeDialog').onclick = closeDialog;
$('bookDialog').addEventListener('close', () => { showMsg($('cancelMsg')); });

// ---------- my bookings ----------
function bookingCard(b) {
  const s = slotsById[b.slot_id];
  const card = h('div', { class: 'card booking', 'data-id': b.id },
    h('div', { class: 'main' },
      h('div', { class: 'when', text: s ? `${s.provider} · ${fmtWhen(s)}` : `Slot ${b.slot_id}` }),
      h('div', { class: 'sub', text: `${b.name} · Ref ${b.id}` })),
    h('span', { class: 'badge ' + b.status, text: b.status }));
  if (b.status === 'confirmed') {
    card.append(h('button', {
      class: 'btn danger cancel-row', type: 'button', text: 'Cancel',
      onclick: async (e) => {
        e.target.disabled = true;
        const r = await api('DELETE', '/bookings/' + encodeURIComponent(b.id));
        if (r.status === 200 || r.status === 409) { card.replaceWith(bookingCard(r.status === 200 ? r.data : { ...b, status: 'cancelled' })); toast('Booking cancelled'); loadSlots(); }
        else { e.target.disabled = false; toast(r.data.error || 'Could not cancel'); }
      },
    }));
  }
  return card;
}
async function loadMine(reset) {
  showMsg($('mineMsg'));
  if (reset) {
    mineEmail = $('mineEmail').value.trim();
    mineCursor = null;
    $('mineList').replaceChildren();
    if (!EMAIL_RE.test(mineEmail)) { $('moreBtn').hidden = true; return showMsg($('mineMsg'), 'bad', 'Please enter a valid email.'); }
  }
  const q = new URLSearchParams({ email: mineEmail, limit: '3' });
  if (mineCursor) q.set('cursor', mineCursor);
  const r = await api('GET', '/bookings?' + q);
  if (r.status !== 200) return showMsg($('mineMsg'), 'bad', r.data.error || 'Could not load bookings.');
  if (!Object.keys(slotsById).length) await loadSlots();
  $('mineList').append(...r.data.bookings.map(bookingCard));
  if (!$('mineList').children.length) showMsg($('mineMsg'), 'ok', 'No bookings found for this email.');
  mineCursor = r.data.next_cursor;
  $('moreBtn').hidden = !mineCursor;
}
$('mineForm').addEventListener('submit', (e) => { e.preventDefault(); loadMine(true); });
$('moreBtn').onclick = () => loadMine(false);

$('lookupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  showMsg($('lookupMsg')); $('lookupResult').replaceChildren();
  const id = $('lookupId').value.trim();
  if (!id) return showMsg($('lookupMsg'), 'bad', 'Please enter a booking reference.');
  const r = await api('GET', '/bookings/' + encodeURIComponent(id));
  if (r.status === 200) $('lookupResult').append(bookingCard(r.data));
  else if (r.status === 404) showMsg($('lookupMsg'), 'bad', 'No booking found with that reference.');
  else showMsg($('lookupMsg'), 'bad', r.data.error || 'Lookup failed.');
});

// ---------- tabs ----------
function selectTab(which) {
  const book = which === 'book';
  $('tabBook').setAttribute('aria-selected', String(book));
  $('tabMine').setAttribute('aria-selected', String(!book));
  $('panelBook').hidden = !book; $('panelMine').hidden = book;
}
$('tabBook').onclick = () => { selectTab('book'); loadSlots(); };
$('tabMine').onclick = () => selectTab('mine');

// ---------- demo data ----------
// Sample schedule for the next 35 days (at least a month), counted from the moment the
// button is clicked, so there are always bookable times whenever someone tests the page.
// Same schedule as scripts/seed.js.
const SCHEDULE = [
  { provider: 'Dr Ade',    days: [1, 2, 3, 4, 5], hours: [9, 9.5, 10, 10.5, 11, 11.5] },   // Mon–Fri mornings
  { provider: 'Dr Bello',  days: [1, 2, 3, 4, 5, 6], hours: [13, 13.5, 14, 14.5, 15] },    // Mon–Sat afternoons
  { provider: 'Dr Chukwu', days: [2, 4, 6], hours: [15, 15.5, 16, 16.5] },                  // Tue, Thu, Sat
];
function sampleSlots(daysAhead = 35) {
  const slots = [];
  const soonest = Date.now() + 30 * 60000; // nothing that starts within 30 minutes
  const base = new Date(); base.setHours(0, 0, 0, 0);
  for (let i = 0; i < daysAhead; i++) {
    const day = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    for (const doc of SCHEDULE) {
      if (!doc.days.includes(day.getDay())) continue;
      for (const hr of doc.hours) {
        const start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), Math.floor(hr), (hr % 1) * 60);
        if (start.getTime() < soonest) continue;
        const end = new Date(start.getTime() + 30 * 60000);
        const id = `${dateKey(start)}-${doc.provider.split(' ')[1].toLowerCase()}-${pad(start.getHours())}${pad(start.getMinutes())}`;
        slots.push({ id, provider: doc.provider, start: start.toISOString().replace('.000Z', 'Z'), end: end.toISOString().replace('.000Z', 'Z') });
      }
    }
  }
  return slots;
}
async function resetDemo() {
  if (!confirm('This replaces ALL appointments with sample ones for the next 5 weeks and deletes ALL bookings. Continue?')) return;
  const slots = sampleSlots();
  const r = await api('POST', '/reset', { slots });
  if (r.status !== 200) return toast(r.data.error || 'Could not load sample appointments');
  provider = ''; selectedDay = null; viewMonth = null;
  $('mineList').replaceChildren(); $('lookupResult').replaceChildren(); $('moreBtn').hidden = true;
  toast(`Loaded ${slots.length} sample appointments for the next 5 weeks`);
  selectTab('book'); loadSlots();
}
$('resetBtn').onclick = resetDemo;

// ---------- start ----------
const saved = keyStore.get();
if (saved) { $('apiKey').value = saved; connect(saved, true); }
else $('apiKey').focus();
</script>
