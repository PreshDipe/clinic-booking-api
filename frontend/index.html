<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Booking</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: #1d2b3a; background: #eef3f8; }
  button, input { font: inherit; }
  [hidden] { display: none !important; }

  /* Top bar */
  .topbar { background: #0a66c2; color: #fff; }
  .topbar .inner { max-width: 1100px; margin: auto; padding: 12px 16px; display: flex; align-items: center; }
  .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-right: auto; }
  .logo span { color: #ffd23f; }
  .topbar button { padding: 7px 14px; border: 1px solid #fff; background: transparent; color: #fff; border-radius: 4px; cursor: pointer; }

  /* Page + cards */
  .page { max-width: 1100px; margin: auto; padding: 36px 16px 60px; }
  .page h1 { font-size: 40px; margin: 0 0 28px; color: #33475b; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.10); }
  .welcome { max-width: 440px; margin: 40px auto; padding: 28px; }
  .welcome h2 { margin: 0 0 6px; }
  .welcome p { margin: 0 0 18px; color: #5b6b7b; }
  input { width: 100%; padding: 11px; border: 1px solid #d5dde5; border-radius: 6px; }
  .btn { padding: 10px 18px; border: 0; border-radius: 6px; background: #0a66c2; color: #fff; cursor: pointer; }
  .btn.red { background: #e02424; }
  .btn.light { background: #eef3f8; color: #1d2b3a; }
  .btn:disabled { opacity: .5; cursor: default; }
  .message { margin-top: 12px; padding: 10px 14px; border-radius: 6px; }
  .message.ok { background: #e7f6ec; color: #116b34; }
  .message.bad { background: #fde8e8; color: #9b1c1c; }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid #e3e8ee; }
  .tab { flex: 1; padding: 16px; border: 0; background: none; cursor: pointer; text-align: left; border-bottom: 3px solid transparent; }
  .tab b { display: block; font-size: 18px; color: #5b6b7b; }
  .tab small { color: #5b6b7b; }
  .tab.active { border-bottom-color: #0a66c2; }
  .tab.active b { color: #0a66c2; }
  .panel { padding: 20px; }

  /* Doctor buttons */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip { padding: 7px 16px; border: 1px solid #c9d6e3; border-radius: 99px; background: #fff; cursor: pointer; }
  .chip.active { background: #0a66c2; border-color: #0a66c2; color: #fff; }

  /* Calendar (left) + times for the chosen day (right) */
  .booker { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .booker { grid-template-columns: 1fr; } .page h1 { font-size: 30px; } }
  .calendar { border: 1px solid #e3e8ee; border-radius: 12px; padding: 14px; }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-head button { width: 34px; height: 34px; border: 1px solid #d5dde5; border-radius: 8px; background: #fff; cursor: pointer; }
  .cal-head button:disabled { opacity: .3; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
  .weekday { font-size: 12px; color: #5b6b7b; font-weight: 600; padding: 4px 0; }
  .day { min-width: 0; height: 46px; padding: 0; border: 0; border-radius: 8px; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; cursor: pointer; }
  .day small { font-size: 9px; color: #0a66c2; white-space: nowrap; }
  .day.open { background: #e7f0fa; }
  .day.selected { background: #0a66c2; color: #fff; }
  .day.selected small { color: #fff; }
  .day:disabled { color: #b4bfca; background: none; cursor: default; }
  .times h3 { margin: 0; font-size: 20px; }
  .times .hint { margin: 2px 0 14px; color: #5b6b7b; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .slot { text-align: left; padding: 12px 14px; border: 1px solid #c9d6e3; border-radius: 10px; background: #fff; cursor: pointer; }
  .slot:hover { border-color: #0a66c2; }
  .slot b { display: block; font-size: 18px; }
  .slot span { color: #5b6b7b; font-size: 14px; }
  .slot em { display: block; margin-top: 6px; font-style: normal; font-weight: 600; color: #0a66c2; font-size: 14px; }

  /* Booking window */
  dialog { border: 0; border-radius: 14px; padding: 24px; width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0; }
  dialog .when { margin: 4px 0 16px; color: #5b6b7b; }
  dialog input { margin-bottom: 10px; }
  .row-buttons { display: flex; gap: 8px; margin-top: 8px; }
  .row-buttons .btn { flex: 1; }
  .done h2 { color: #116b34; }
  .done p { margin: 6px 0; }

  /* My bookings */
  .find { display: flex; gap: 8px; margin-bottom: 8px; }
  .booking { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e3e8ee; flex-wrap: wrap; }
  .status { font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 99px; background: #e7f6ec; color: #116b34; }
  .status.cancelled { background: #fde8e8; color: #9b1c1c; }
  .muted { color: #5b6b7b; }
</style>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="logo">Clinic <span>Booking</span></div>
    <button id="resetBtn" hidden title="POST /reset: clear all bookings and load 5 weeks of appointments">Reset</button>
  </div>
</header>

<!-- Screen 1: enter the API key -->
<main class="page" id="welcome">
  <form class="card welcome" id="keyForm">
    <h2>Welcome</h2>
    <p>Enter the clinic's API key to see available appointments.</p>
    <input id="apiKey" type="password" placeholder="API key" required>
    <button class="btn" style="width:100%;margin-top:12px">Continue</button>
    <div id="keyMessage"></div>
  </form>
</main>

<!-- Screen 2: book -->
<main class="page" id="app" hidden>
  <h1>Book the Best Doctor</h1>
  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="book"><b>Book an appointment</b><small>Pick a day and a time</small></button>
      <button class="tab" data-tab="mine"><b>My bookings</b><small>View or cancel</small></button>
    </div>

    <section class="panel" id="book">
      <div class="chips" id="doctors"></div>
      <div class="booker">
        <div class="calendar">
          <div class="cal-head">
            <button id="prevMonth">‹</button><b id="monthName"></b><button id="nextMonth">›</button>
          </div>
          <div class="grid" id="days"></div>
        </div>
        <div class="times">
          <h3 id="dayName"></h3>
          <p class="hint" id="dayHint"></p>
          <div class="slots" id="slots"></div>
        </div>
      </div>
      <div id="pageMessage"></div>
    </section>

    <section class="panel" id="mine" hidden>
      <form class="find" id="mineForm"><input id="myEmail" type="email" placeholder="Email you booked with" required><button class="btn">Find</button></form>
      <div id="myBookings"></div>
      <button class="btn light" id="moreBtn" hidden>Load more</button>
      <form class="find" id="lookupForm" style="margin-top:24px"><input id="lookupId" placeholder="Or look up a booking reference" required><button class="btn light">Look up</button></form>
      <div id="lookupResult"></div>
    </section>
  </div>
</main>

<!-- Booking window: opens when a time is clicked -->
<dialog id="bookDialog">
  <form id="bookForm">
    <h2 id="dialogTitle"></h2>
    <p class="when" id="dialogWhen"></p>
    <input id="name" placeholder="Full name" required>
    <input id="email" type="email" placeholder="Email" required>
    <div class="row-buttons">
      <button class="btn light" type="button" id="closeBtn">Close</button>
      <button class="btn red" id="confirmBtn">Confirm booking</button>
    </div>
    <div id="bookMessage"></div>
  </form>
  <div class="done" id="doneView" hidden></div>
</dialog>

<script src="config.js"></script>
<script>
// ------------------------------------------------------------------ setup
const API = window.CLINIC_API_BASE;          // API Gateway URL, from config.js
const $ = (id) => document.getElementById(id);
let allSlots = [];                           // every slot from GET /slots
let doctor = '';                             // '' = all doctors
let selectedDay = null;                      // e.g. "2026-11-16"
let month = null;                            // the month shown in the calendar
let picked = null;                           // the slot being booked
let nextCursor = null;                       // paging in My bookings

$('apiKey').value = sessionStorage.getItem('apiKey') || '';   // remembered for this tab only

// Every API call goes through here and sends the API key.
async function api(method, path, body, headers = {}) {
  const res = await fetch(API + path, {
    method,
    headers: { 'X-API-Key': $('apiKey').value, 'Content-Type': 'application/json', ...headers },
    body: body ? JSON.stringify(body) : undefined,
  });
  return { status: res.status, data: await res.json(), retryAfter: res.headers.get('Retry-After') };
}

function message(boxId, text, ok) {
  $(boxId).innerHTML = text ? `<div class="message ${ok ? 'ok' : 'bad'}">${escape(text)}</div>` : '';
}
function escape(text) {                      // makes names/emails safe to put on the page
  return String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
}

// Date helpers. A "day key" is the local date, e.g. "2026-11-16".
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (date) => { const d = new Date(date); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const longDay = (date) => new Date(date).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
const timeOf = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const isOpen = (s) => s.available && new Date(s.start) > new Date();   // not booked and not in the past
const describe = (slotId) => {
  const s = allSlots.find((x) => x.id === slotId);
  return s ? `${s.provider} · ${longDay(s.start)} at ${timeOf(s.start)}` : `Slot ${slotId}`;
};

// ------------------------------------------------------------------ 0. API key screen
async function connect() {
  if (!(await loadSlots())) return;
  sessionStorage.setItem('apiKey', $('apiKey').value);
  $('welcome').hidden = true; $('app').hidden = false; $('resetBtn').hidden = false;
}

// ------------------------------------------------------------------ 1. load the slots
async function loadSlots() {
  const { status, data } = await api('GET', '/slots');
  if (status !== 200) {                      // e.g. 401 wrong key: back to the key screen
    $('welcome').hidden = false; $('app').hidden = true; $('resetBtn').hidden = true;
    message('keyMessage', `${status}: ${data.error}`);
    return false;
  }
  allSlots = data.slots;
  drawDoctors();
  drawCalendar();
  drawTimes();
  return true;
}

// Slots for the chosen doctor, grouped by day: { "2026-11-16": [slot, slot, ...] }
function slotsByDay() {
  const days = {};
  for (const s of allSlots) {
    if (doctor && s.provider !== doctor) continue;
    (days[dayKey(s.start)] ||= []).push(s);
  }
  return days;
}

function drawDoctors() {
  const names = ['', ...new Set(allSlots.map((s) => s.provider))];
  $('doctors').innerHTML = names.map((n) =>
    `<button class="chip ${n === doctor ? 'active' : ''}" data-doctor="${escape(n)}">${n ? escape(n) : 'All doctors'}</button>`).join('');
}

$('doctors').onclick = (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  doctor = chip.dataset.doctor;
  drawDoctors(); drawCalendar(); drawTimes();
};

// ------------------------------------------------------------------ 2. the calendar
function drawCalendar() {
  const days = slotsByDay();
  // Start on the first day that has open times (if the chosen day has none left).
  if (!selectedDay || !(days[selectedDay] || []).some(isOpen)) {
    selectedDay = Object.keys(days).sort().find((d) => days[d].some(isOpen)) || null;
    if (selectedDay) month = new Date(selectedDay + 'T00:00');
  }
  if (!month) month = new Date();

  const year = month.getFullYear(), m = month.getMonth();
  $('monthName').textContent = month.toLocaleDateString([], { month: 'long', year: 'numeric' });
  const now = new Date();
  $('prevMonth').disabled = year === now.getFullYear() && m <= now.getMonth();

  let html = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => `<div class="weekday">${d}</div>`).join('');
  const blanks = (new Date(year, m, 1).getDay() + 6) % 7;                  // weeks start on Monday
  html += '<div></div>'.repeat(blanks);
  for (let d = 1; d <= new Date(year, m + 1, 0).getDate(); d++) {
    const key = `${year}-${pad(m + 1)}-${pad(d)}`;
    const open = (days[key] || []).filter(isOpen).length;
    const past = key < dayKey(now);
    html += `<button class="day ${open ? 'open' : ''} ${key === selectedDay ? 'selected' : ''}" data-day="${key}"
               ${past || !open ? 'disabled' : ''}>${d}${open ? `<small>${open} open</small>` : ''}</button>`;
  }
  $('days').innerHTML = html;
}

$('days').onclick = (e) => {
  const day = e.target.closest('.day');
  if (!day || day.disabled) return;
  selectedDay = day.dataset.day;
  drawCalendar(); drawTimes();
};
$('prevMonth').onclick = () => { month = new Date(month.getFullYear(), month.getMonth() - 1, 1); drawCalendar(); };
$('nextMonth').onclick = () => { month = new Date(month.getFullYear(), month.getMonth() + 1, 1); drawCalendar(); };

// ------------------------------------------------------------------ 3. the times for the chosen day
function drawTimes() {
  const open = (slotsByDay()[selectedDay] || []).filter(isOpen);
  if (!open.length) {
    $('dayName').textContent = 'No open appointments';
    $('dayHint').textContent = 'Click Reset (top right) to load appointments for the next 5 weeks.';
    $('slots').innerHTML = '';
    return;
  }
  $('dayName').textContent = longDay(open[0].start);
  $('dayHint').textContent = `${open.length} open times. Click one to book.`;
  $('slots').innerHTML = open.map((s) => `
    <button class="slot" data-id="${escape(s.id)}">
      <b>${timeOf(s.start)}</b><span>${escape(s.provider)} · 30 min</span><em>Book →</em>
    </button>`).join('');
}

// ------------------------------------------------------------------ 4. book (in the booking window)
$('slots').onclick = (e) => {
  const button = e.target.closest('.slot');
  if (!button) return;
  picked = allSlots.find((s) => s.id === button.dataset.id);
  $('dialogTitle').textContent = `Book with ${picked.provider}`;
  $('dialogWhen').textContent = `${longDay(picked.start)} at ${timeOf(picked.start)}`;
  $('bookForm').hidden = false; $('doneView').hidden = true;
  message('bookMessage', '');
  $('bookDialog').showModal();
};

$('bookForm').onsubmit = async (e) => {
  e.preventDefault();
  const body = { slot_id: picked.id, name: $('name').value, email: $('email').value };
  $('confirmBtn').disabled = true;
  // Idempotency-Key (Level 4): if this request is retried, the API won't book twice.
  const { status, data, retryAfter } = await api('POST', '/bookings', body, { 'Idempotency-Key': crypto.randomUUID() });
  $('confirmBtn').disabled = false;

  if (status === 201) { showConfirmation(data); loadSlots(); }
  else if (status === 409) { message('bookMessage', 'Sorry, someone just booked this time. Please choose another.'); loadSlots(); }
  else if (status === 429) message('bookMessage', `Too many attempts. Try again in ${retryAfter} seconds.`);
  else message('bookMessage', `${status}: ${data.error}`);
};

// The confirmation replaces the form inside the window.
function showConfirmation(b) {
  const booked = b.status === 'confirmed';
  $('bookForm').hidden = true; $('doneView').hidden = false;
  $('doneView').innerHTML = `
    <h2>${booked ? '✓ You are booked' : 'Booking cancelled'}</h2>
    <p><b>${escape(describe(b.slot_id))}</b></p>
    <p>${escape(b.name)} · ${escape(b.email)}</p>
    <p class="muted">Booking reference: <code>${escape(b.id)}</code></p>
    <div class="row-buttons">
      ${booked ? `<button class="btn light" onclick="cancel('${escape(b.id)}')">Cancel booking</button>` : ''}
      <button class="btn" onclick="$('bookDialog').close()">Done</button>
    </div>`;
}

// Cancel (Level 3): the slot becomes free again.
async function cancel(id) {
  const { status, data } = await api('DELETE', `/bookings/${encodeURIComponent(id)}`);
  if (status !== 200) return alert(`${status}: ${data.error}`);
  if ($('bookDialog').open) showConfirmation(data);
  loadSlots();
  if (!$('mine').hidden && $('myEmail').value) findMyBookings(true);
}

$('closeBtn').onclick = () => $('bookDialog').close();

// ------------------------------------------------------------------ 5. my bookings + look up
function bookingRow(b) {
  return `<div class="booking">
      <span><b>${escape(describe(b.slot_id))}</b><br><span class="muted">${escape(b.name)} · Ref ${escape(b.id)}</span></span>
      <span><span class="status ${b.status}">${b.status}</span>
      ${b.status === 'confirmed' ? `<button class="btn light" onclick="cancel('${escape(b.id)}')">Cancel</button>` : ''}</span>
    </div>`;
}

// Paging (Level 4): 3 per page; "Load more" sends back the next_cursor the API returned.
async function findMyBookings(fromStart) {
  if (fromStart) { nextCursor = null; $('myBookings').innerHTML = ''; }
  const query = `email=${encodeURIComponent($('myEmail').value)}&limit=3` + (nextCursor ? `&cursor=${nextCursor}` : '');
  const { status, data } = await api('GET', `/bookings?${query}`);
  if (status !== 200) return message('myBookings', `${status}: ${data.error}`);
  $('myBookings').innerHTML += data.bookings.map(bookingRow).join('')
    || (fromStart ? '<p class="muted">No bookings for this email.</p>' : '');
  nextCursor = data.next_cursor;                       // null on the last page
  $('moreBtn').hidden = !nextCursor;
}

$('mineForm').onsubmit = (e) => { e.preventDefault(); findMyBookings(true); };
$('moreBtn').onclick = () => findMyBookings(false);
$('lookupForm').onsubmit = async (e) => {
  e.preventDefault();
  const { status, data } = await api('GET', `/bookings/${encodeURIComponent($('lookupId').value.trim())}`);
  if (status === 200) $('lookupResult').innerHTML = bookingRow(data);
  else message('lookupResult', status === 404 ? 'No booking found with that reference.' : `${status}: ${data.error}`);
};

// ------------------------------------------------------------------ 6. reset (POST /reset)
// Loads 5 weeks of appointments from today (no Sundays), then replaces everything via POST /reset.
const SCHEDULE = [
  { doctor: 'Dr Ade',    days: [1, 2, 3, 4, 5],    hours: [9, 9.5, 10, 10.5, 11, 11.5] },  // Mon–Fri mornings
  { doctor: 'Dr Bello',  days: [1, 2, 3, 4, 5, 6], hours: [13, 13.5, 14, 14.5, 15] },      // Mon–Sat afternoons
  { doctor: 'Dr Chukwu', days: [2, 4, 6],          hours: [15, 15.5, 16, 16.5] },          // Tue, Thu, Sat
];

async function reset() {
  if (!confirm('Reset deletes ALL bookings and loads 5 weeks of new appointments. Continue?')) return;
  const slots = [];
  for (let i = 0; i < 35; i++) {
    const day = new Date(); day.setHours(0, 0, 0, 0); day.setDate(day.getDate() + i);
    for (const { doctor: name, days, hours } of SCHEDULE) {
      if (!days.includes(day.getDay())) continue;
      for (const h of hours) {
        const start = new Date(day); start.setHours(Math.floor(h), (h % 1) * 60);
        if (start < Date.now() + 30 * 60000) continue;          // skip times that have passed
        const end = new Date(start.getTime() + 30 * 60000);
        slots.push({ id: `${dayKey(start)}-${name.split(' ')[1].toLowerCase()}-${pad(start.getHours())}${pad(start.getMinutes())}`,
                     provider: name, start: start.toISOString(), end: end.toISOString() });
      }
    }
  }
  const { status, data } = await api('POST', '/reset', { slots });
  selectedDay = null; month = null;
  await loadSlots();
  message('pageMessage', status === 200 ? `Reset done: ${slots.length} appointments loaded.` : `${status}: ${data.error}`, status === 200);
}

// ------------------------------------------------------------------ buttons
$('keyForm').onsubmit = (e) => { e.preventDefault(); connect(); };
$('resetBtn').onclick = reset;
document.querySelectorAll('.tab').forEach((tab) => tab.onclick = () => {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
  $('book').hidden = tab.dataset.tab !== 'book';
  $('mine').hidden = tab.dataset.tab !== 'mine';
});

if ($('apiKey').value) connect();            // reconnect automatically after a page refresh
</script>
</body>
</html>
